<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Impressum – KickbaseChampion</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f7f7f7;
      color: #111;
      line-height: 1.6;
    }
    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 60px 24px;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 42px;
      box-shadow: 0 8px 30px rgba(0,0,0,.06);
    }
    h1 {
      margin: 0 0 30px;
      font-size: 34px;
      letter-spacing: -0.5px;
    }
    h2 {
      margin-top: 30px;
      font-size: 20px;
    }
    a { color: inherit; }
    .brand {
      color: #666;
      margin-bottom: 8px;
      font-size: 15px;
    }
    @media (max-width: 600px) {
      .container { padding: 24px 16px; }
      .card { padding: 28px 22px; }
      h1 { font-size: 28px; }
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="card">
      <div class="brand">KickbaseChampion</div>
      <h1>Impressum</h1>

      <h2>Angaben gemäß § 5 DDG</h2>
      <p>
        Moritz Höpfner<br>
        Augustastraße 32<br>
        12203 Berlin<br>
        Deutschland
      </p>

      <h2>Kontakt</h2>
      <p>
        E-Mail:
        <a href="mailto:Kickbasechampion@gmail.com">Kickbasechampion@gmail.com</a>

</body>
</html>
